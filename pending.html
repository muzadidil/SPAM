<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cek Transaksi Pending</title>
<style>
  :root { --bg:#f6f7f9; --kartu:#fff; --teks:#1b1f24; --redup:#667085; --garis:#e3e6ea; --aksen:#0b6bcb; --merah:#c62828; --kuning:#b26a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --kartu:#1d2125; --teks:#e8eaed; --redup:#9aa3ad; --garis:#2d333a; --aksen:#58a6ff; --merah:#ff7b72; --kuning:#e3b341; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--teks); font:15px/1.45 system-ui, sans-serif; }
  main { max-width:860px; margin:0 auto; display:grid; gap:14px; }
  h1 { font-size:20px; margin:0; }
  .kartu { background:var(--kartu); border:1px solid var(--garis); border-radius:10px; padding:14px; }
  textarea { width:100%; min-height:150px; padding:10px; border:1px solid var(--garis); border-radius:8px; background:var(--bg); color:var(--teks); font:13px/1.4 ui-monospace, Consolas, monospace; resize:vertical; }
  .opsi { display:flex; flex-wrap:wrap; gap:12px; align-items:end; margin-top:10px; }
  label { display:grid; gap:4px; font-size:13px; color:var(--redup); }
  input[type=number], input[type=text] { padding:7px 9px; border:1px solid var(--garis); border-radius:8px; background:var(--bg); color:var(--teks); font:inherit; }
  input[type=number] { width:90px; }
  button { padding:8px 14px; border:0; border-radius:8px; background:var(--aksen); color:#fff; font:inherit; cursor:pointer; }
  button.sekunder { background:transparent; color:var(--aksen); border:1px solid var(--aksen); }
  .ringkas { display:flex; flex-wrap:wrap; gap:18px; margin-bottom:10px; }
  .ringkas b { font-size:22px; display:block; }
  .ringkas span { font-size:13px; color:var(--redup); }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--garis); }
  th { font-size:12px; color:var(--redup); font-weight:600; }
  .lama { color:var(--merah); font-weight:600; }
  .sedang { color:var(--kuning); font-weight:600; }
  .kosong { color:var(--redup); padding:6px 0; }
  .tabel { overflow-x:auto; }
</style>
</head>
<body>
<main>
  <h1>Cek Transaksi Pending</h1>

  <section class="kartu">
    <textarea id="data" placeholder="Tempel daftar transaksi di sini, contoh:&#10;19/10/26 09:31:07  SF10  088242542995  Menunggu Jawaban"></textarea>
    <div class="opsi">
      <label>Pending lebih dari (menit)
        <input id="batas" type="number" min="0" value="15">
      </label>
      <label>Kata status pending (pisah koma)
        <input id="kunci" type="text" value="menunggu">
      </label>
      <button id="cek">Cek</button>
      <button id="bersih" class="sekunder">Kosongkan</button>
    </div>
  </section>

  <section class="kartu">
    <div class="ringkas">
      <div><b id="nTelat">0</b><span>pending lewat batas</span></div>
      <div><b id="nMenunggu">0</b><span>total menunggu</span></div>
      <div><b id="nTotal">0</b><span>baris terbaca</span></div>
    </div>
    <div class="tabel" id="hasil"><div class="kosong">Belum ada data.</div></div>
  </section>

  <section class="kartu">
    <button id="salin" class="sekunder">Salin ringkasan untuk CS supplier</button>
    <span id="info" class="kosong"></span>
  </section>
</main>

<script src="pending.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let terakhir = [];

  function jalankan() {
    const sekarang = new Date();
    const batas = Number($('batas').value) || 0;
    const rows = bacaBaris($('data').value);
    const { total, menunggu, telat } = cariPending(rows, {
      sekarang,
      batasMenit: batas,
      kataKunci: $('kunci').value.split(','),
    });
    terakhir = telat;
    $('nTelat').textContent = telat.length;
    $('nMenunggu').textContent = menunggu;
    $('nTotal').textContent = total;

    if (!telat.length) {
      $('hasil').innerHTML = `<div class="kosong">${total ? 'Tidak ada yang pending melewati batas.' : 'Belum ada data.'}</div>`;
      return;
    }
    const baris = telat.map((r) => {
      const kelas = r.umurMenit >= 60 ? 'lama' : r.umurMenit >= 30 ? 'sedang' : '';
      return `<tr><td>${formatTgl(r.waktu)} ${formatJam(r.waktu)}</td><td>${r.kode}</td><td>${r.nomor}</td><td class="${kelas}">${formatUmur(r.umurMenit)}</td></tr>`;
    });
    $('hasil').innerHTML = `<table><thead><tr><th>Waktu</th><th>Kode</th><th>Nomor</th><th>Umur</th></tr></thead><tbody>${baris.join('')}</tbody></table>`;
  }

  $('cek').addEventListener('click', jalankan);
  $('data').addEventListener('input', jalankan);
  $('batas').addEventListener('input', jalankan);
  $('kunci').addEventListener('input', jalankan);
  $('bersih').addEventListener('click', () => { $('data').value = ''; $('info').textContent = ''; jalankan(); });
  $('salin').addEventListener('click', async () => {
    if (!terakhir.length) { $('info').textContent = ' Tidak ada yang disalin.'; return; }
    try {
      await navigator.clipboard.writeText(ringkasan(terakhir, Number($('batas').value) || 0));
      $('info').textContent = ' Tersalin.';
    } catch (e) {
      $('info').textContent = ' Gagal menyalin, salin manual dari teks yang tampil.';
    }
  });
</script>
</body>
</html>
